<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link rel="stylesheet" href="./style.css">
</head> 
<body>
<div class="container">
  <div class="header">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>Secret Santa</h1>
        <div class="small">Sign in with Hack Club</div>
      </div>
    </div>
  </div>

  <div class="card" style="max-width:520px;">
    <h2>Log in</h2>

    <div class="row" style="margin-top:12px;">
      <button id="loginBtn" class="primary" onclick="loginWithHackClub()">
        Sign in with Hack Club
      </button>
    </div>

    <div class="small" style="margin-top:8px; opacity:.75;">
      You’ll be redirected to Hack Club Auth
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  // Redirect to Netlify serverless function that begins OAuth flow
  function loginWithHackClub() {
    window.location.href = "/.netlify/functions/auth-login";
  }
</script>
</body>
</html>
